[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cag-okf"
version = "0.1.0"
description = "Cache-Augmented Generation (CAG) combined with Open Knowledge Format (OKF) for token performance and zero-prefill latency"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
cag-okf = "cli:main"
